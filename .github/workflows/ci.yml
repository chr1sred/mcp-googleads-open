name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Shell scripts (shellcheck)
        run: shellcheck tests/*.sh

      - name: Python scripts (sintaxe)
        run: python3 -m py_compile scripts/*.py

      - name: JSON (captain-definition)
        run: python3 -m json.tool captain-definition > /dev/null

  smoke-test:
    name: Build + smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t mcp-googleads-open:test .

      - name: Smoke test
        run: IMAGE=mcp-googleads-open:test bash tests/smoke-test.sh

      - name: Tamanho da imagem
        run: |
          docker image ls mcp-googleads-open:test --format 'Imagem: {{.Size}}'
