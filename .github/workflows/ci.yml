name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Shell scripts (shellcheck)
        run: shellcheck tests/*.sh

      - name: Python scripts (sintaxe)
        run: python3 -m py_compile scripts/*.py

      - name: JSON (captain-definition)
        run: python3 -m json.tool captain-definition > /dev/null

  smoke-test:
    name: Build + smoke test
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem
        run: docker build -t mcp-googleads-open:test .

      - name: Smoke test
        shell: bash
        run: |
          set -o pipefail
          {
            echo '### Smoke test'
            echo '```'
            rc=0
            IMAGE=mcp-googleads-open:test bash tests/smoke-test.sh || rc=$?
            echo '```'
            exit "$rc"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tamanho da imagem
        run: |
          docker image ls mcp-googleads-open:test --format 'Imagem: {{.Size}}'
