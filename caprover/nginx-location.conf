# Linhas para adicionar DENTRO do bloco `location / { ... }` da config nginx
# do app no CapRover (App > HTTP Settings > Edit Default Nginx Configurations).
# Lines to add INSIDE the `location / { ... }` block of the app's CapRover nginx config.
#
# Necessárias para o Streamable HTTP / SSE do MCP não ser cortado ou bufferizado.
# Required so MCP Streamable HTTP / SSE responses are not buffered or cut off.

proxy_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
chunked_transfer_encoding on;
