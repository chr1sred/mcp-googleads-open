# Alternativa ao CapRover: Docker Compose puro (atrás do seu proxy reverso com HTTPS).
# Alternative to CapRover: plain Docker Compose (behind your own HTTPS reverse proxy).
services:
  google-ads-mcp:
    # Imagem pronta / prebuilt image (recomendado / recommended):
    image: ghcr.io/chr1sred/mcp-googleads-open:1.0.0
    # Ou build local / or build locally: comente a linha acima e descomente / comment above, uncomment:
    # build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - oauth-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  oauth-data:
